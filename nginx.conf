# Templated for the official nginx image: /etc/nginx/templates/*.conf.template
# is envsubst'd into /etc/nginx/conf.d/ at startup. ${API_UPSTREAM} is replaced
# from the environment (image default http://api:5000); nginx runtime variables
# ($host, $uri, ...) are single-dollar and untouched by envsubst.

# WebSocket-aware connection header for the Socket.io proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bulk imports / uploads travel as JSON bodies
    client_max_body_size 50m;

    # App health (probes the backend through the proxy chain)
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Backend API — same origin, so the auth cookie is first-party and no
    # CORS is involved. Resolved per-request via Docker DNS so a recreated
    # api container (new IP) is picked up without reloading nginx.
    # (^~ so the static-asset regex below never shadows API file URLs)
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.io — WebSocket upgrade + polling fallback
    location ^~ /socket.io/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
